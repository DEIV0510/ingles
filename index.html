<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>De Burst a Crept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F6FB;
  --grid:rgba(44,92,196,.075);
  --surface:#FFFFFF;
  --surface-2:#EDF1F9;
  --surface-3:#E1E7F3;
  --ink:#16204A;
  --ink-2:#414C72;
  --ink-3:#5C688D;
  --line:#D6DDEB;
  --line-strong:#AEB9D2;
  --hl:#FFE14A;
  --hl-ink:#141B3D;
  --g-same:#9DD7FF;
  --g-ght:#FFB0D8;
  --g-vowel:#FFC680;
  --g-ept:#B4EC95;
  --ok:#137A45;
  --ok-bg:#E3F5EA;
  --ok-line:#93D3AC;
  --bad:#C42C24;
  --bad-bg:#FCE9E7;
  --bad-line:#EFAAA4;
  --pen:#CF2F27;
  --bluepen:#2446C4;
  --btn:#16204A;
  --btn-ink:#FFFFFF;
  --btn-hover:#26336E;
  --focus:#2E66F5;
  --shadow:0 1px 2px rgba(22,32,74,.06),0 6px 20px rgba(22,32,74,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1330;--grid:rgba(150,176,255,.06);--surface:#151C3F;--surface-2:#1C2551;--surface-3:#26305F;
    --ink:#E9EDFB;--ink-2:#BAC3E1;--ink-3:#9AA5CA;--line:#29335F;--line-strong:#3D4981;
    --ok:#4CD68F;--ok-bg:#133329;--ok-line:#2C7454;--bad:#FF8076;--bad-bg:#3A1A28;--bad-line:#8C3A43;
    --pen:#FF7268;--bluepen:#9DB4FF;--btn:#FFE14A;--btn-ink:#141B3D;--btn-hover:#FFEA80;--focus:#8FAEFF;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1330;--grid:rgba(150,176,255,.06);--surface:#151C3F;--surface-2:#1C2551;--surface-3:#26305F;
  --ink:#E9EDFB;--ink-2:#BAC3E1;--ink-3:#9AA5CA;--line:#29335F;--line-strong:#3D4981;
  --ok:#4CD68F;--ok-bg:#133329;--ok-line:#2C7454;--bad:#FF8076;--bad-bg:#3A1A28;--bad-line:#8C3A43;
  --pen:#FF7268;--bluepen:#9DB4FF;--btn:#FFE14A;--btn-ink:#141B3D;--btn-hover:#FFEA80;--focus:#8FAEFF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding-inline:16px;
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
::selection{background:var(--hl);color:var(--hl-ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:22px;height:22px;flex:none}

h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(28px,7.4vw,36px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
b,strong{font-weight:600}
.lead{color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* resaltador */
.mk{background:var(--mk,var(--hl));color:var(--hl-ink);padding:.02em .24em .06em;border-radius:.22em .5em .28em .46em/.46em .3em .5em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:inherit}
.hand{font-family:var(--f-hand);font-weight:700;font-size:23px;line-height:1;color:var(--ink-2);white-space:nowrap}

/* estructura */
.app{max-width:560px;margin-inline:auto;padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
.app.no-tabs{padding-bottom:40px}
.view,.page{display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;gap:10px}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head .muted{font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px;color:var(--ink)}
.wordmark .mk{padding:0 .22em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill .ic{width:16px;height:16px;color:var(--ok)}
.pill b{color:var(--ink)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;text-align:center;transition:background-color .15s,transform .1s}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.btn .ic{width:20px;height:20px}
.btn-block{width:100%}
.btn-2{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-2:hover{background:var(--surface-2)}
.btn-ok{background:var(--ok);color:var(--surface)}
.btn-ok:hover{background:var(--ok);filter:brightness(1.07)}
.btn-sm{min-height:44px;padding:8px 14px;font-size:14.5px;border-radius:12px}
.btn-sm .ic{width:18px;height:18px}
.btn-link{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:10px 4px;min-height:44px;font-size:14.5px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .ic{width:20px;height:20px}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar-inner{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;border:0;background:none;color:var(--ink-3);font-size:12.5px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:600}

/* inicio: fichas de dominio */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:70px;padding:8px 2px 7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;color:var(--ink)}
.tile:hover{border-color:var(--line-strong)}
.tile-base{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.tile-past{font-family:var(--f-display);font-weight:800;font-size:15.5px;line-height:1.25}
.tile.l2{border-color:var(--ok-line);background:var(--ok-bg)}
.tile .tick{position:absolute;top:4px;right:4px;width:15px;height:15px;color:var(--ok)}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line-strong)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ic{width:15px;height:15px;color:var(--ok)}
.stats{font-size:14px;color:var(--ink-2)}

/* ruta */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.step:hover{border-color:var(--line-strong)}
.step-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;background:var(--surface-2);color:var(--ink-2)}
.step-n .ic{width:18px;height:18px}
.step.done .step-n{background:var(--ok);color:var(--surface)}
.step.current{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.step.current .step-n{background:var(--hl);color:var(--hl-ink)}
.step-t{display:block;font-weight:600;line-height:1.3}
.step-s{display:block;font-size:13.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.step-m{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* plan */
.plan{list-style:none;margin:0;padding:0}
.plan li{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr);gap:14px;padding-bottom:16px}
.plan li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--hl);border:2px solid var(--ink);margin-top:6px}
.plan li::after{content:"";position:absolute;left:5px;top:22px;bottom:2px;width:2px;background:var(--line-strong)}
.plan li:last-child{padding-bottom:0}
.plan li:last-child::after{display:none}
.plan-when{font-weight:600;display:block}
.plan-what{color:var(--ink-2);font-size:15px;display:block}

/* segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-weight:500;font-size:14.5px;padding:6px 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.seg-body{display:flex;flex-direction:column;gap:14px}

/* grupos */
.grp{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.grp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--mk,var(--hl));color:var(--hl-ink);white-space:nowrap}
.grp-count{font-size:13px;color:var(--ink-3)}
.grp-rule{color:var(--ink-2)}
.vlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow-main{display:flex;flex-direction:column;gap:2px;padding:12px 0;background:none;border:0;text-align:left;width:100%;color:var(--ink)}
.vrow-pair{font-family:var(--f-display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow-pair .ic{color:var(--ink-3);width:18px;height:18px}
.vrow-base{color:var(--ink-2)}
.vrow-es{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* notas al margen */
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.note p{color:var(--ink)}
.note-ojo{background:var(--bad-bg);border-color:var(--bad-line)}
.note-ojo .hand{color:var(--bad)}
@media (max-width:380px){.note{grid-template-columns:1fr}}

/* tabla del profe */
.tbl-wrap{overflow-x:auto;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:9px 12px;text-align:left;vertical-align:middle}
.tbl tr>:first-child{border-left:0}
.tbl tr>:last-child{border-right:0}
.tbl thead th{border-top:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .c-base{font-weight:500;color:var(--ink-2)}
.tbl .c-past{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.tbl .c-es{color:var(--ink-2);font-size:14px;line-height:1.35}
.tbl .c-say{width:56px;padding:4px 6px}
.tbl tr.playing td{background:color-mix(in srgb,var(--hl) 30%,var(--surface))}
.reveal{min-height:44px;min-width:76px;border:1.5px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--ink-3);font-size:14px;font-weight:500}
.reveal:hover{color:var(--ink);border-color:var(--ink-3)}

/* historia */
.story{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.story-line{display:flex;flex-direction:column;gap:2px;padding:4px 8px;margin:-4px -8px;border-radius:10px;transition:background-color .2s}
.story-line.playing{background:color-mix(in srgb,var(--hl) 26%,var(--surface))}
.story-en{font-size:18px;line-height:1.6}
.story-es{font-size:14px;color:var(--ink-3)}
.gap{display:inline-flex;align-items:center;min-height:36px;padding:2px 10px;margin-block:2px;border-radius:8px;border:1.5px dashed var(--line-strong);background:var(--surface-2);color:var(--ink-3);font-size:16px;font-weight:500;vertical-align:baseline}
.gap:hover{color:var(--ink)}

/* ficha de verbo */
.page-top{display:flex;align-items:center;gap:12px}
.page-top .eyebrow{flex:1}
.vd{display:flex;flex-direction:column;gap:10px;padding:20px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.vd-pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vd-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.vd-w{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,52px);line-height:1;letter-spacing:-.02em}
.vd-wrow{display:flex;align-items:center;gap:10px}
.vd-arrow{color:var(--ink-3);padding-top:18px}
.vd-arrow .ic{width:28px;height:28px}
.vd-es{font-size:17px;color:var(--ink-2)}
.vd-say{font-size:14.5px;color:var(--ink-3)}
.wrongs{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{padding:5px 12px;border-radius:999px;border:1px solid var(--bad-line);background:var(--bad-bg);color:var(--bad);font-size:14.5px;text-decoration-thickness:2px}
.sents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 12px 12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.sent-en{font-size:16.5px}
.sent-es{font-size:14px;color:var(--ink-3);margin-top:2px}

/* lecciones */
.pdots{display:flex;gap:6px;flex:1}
.pdots i{flex:1;height:6px;border-radius:99px;background:var(--surface-3)}
.pdots i.on{background:var(--ink)}
.lesson-body{display:flex;flex-direction:column;gap:16px}
.lesson-nav{display:flex;gap:10px}
.lesson-nav .btn{flex:1}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ex-en{font-size:19px;font-weight:500}
.ex-es{font-size:14.5px;color:var(--ink-3);grid-column:1}
.ex .icon-btn{grid-row:1/span 2;grid-column:2}
.tchip{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.tchip span{color:var(--ink-3)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pair{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pair .ic{width:16px;height:16px;color:var(--ink-3)}
.pair s{color:var(--bad);font-size:13.5px;flex-basis:100%}
.conj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.conj div{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.conj b{display:block;font-weight:500}
.conj span{font-size:13.5px;color:var(--ink-3)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.checks .ic{color:var(--ok);margin-top:2px;width:20px;height:20px}
.gsum{display:flex;flex-direction:column;gap:8px}
.gsum-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.gsum-row .ex-w{font-family:var(--f-display);font-weight:800;font-size:17px}
.gsum-row .muted{grid-column:2;font-size:13.5px}
.gverbs{display:flex;flex-direction:column;gap:8px}
.gv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.gv-pair{font-family:var(--f-display);font-weight:800;font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gv-pair .ic{color:var(--ink-3)}
.gv-es{grid-column:1;color:var(--ink-3);font-size:14.5px}
.gv .icon-btn{grid-row:1/span 2;grid-column:2}
.chant-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chant-item{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:18px;transition:background-color .2s}
.chant-item span{color:var(--ink-3);font-weight:600}
.chant-item.playing{background:color-mix(in srgb,var(--hl) 35%,var(--surface));border-color:var(--hl)}

/* hoja del quiz */
.sheet{position:relative;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;box-shadow:var(--shadow);padding:16px 16px 8px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:50px;width:2px;background:var(--pen);opacity:.3}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sheet-title{font-family:var(--f-display);font-weight:800;font-size:19px}
.sheet-date{font-family:var(--f-hand);font-size:22px;color:var(--bluepen)}
.ex-list{list-style:none;margin:0;padding:0}
.ex-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1.35fr);align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-height:62px}
.ex-row:last-child{border-bottom:0}
.ex-n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600;font-size:14px}
.ex-prompt{font-family:var(--f-display);font-weight:800;font-size:19px;padding-left:6px;overflow-wrap:anywhere}
.ex-prompt.ex-es{font-family:var(--f-body);font-weight:500;font-size:15.5px}
.ex-prompt-audio{display:flex;align-items:center;gap:8px;padding-left:4px;flex-wrap:wrap}
.ex-prompt-audio b{font-family:var(--f-display);font-weight:800}
.ex-ans{display:flex;align-items:center;gap:6px;min-width:0}
.ex-input{flex:1;min-width:0;width:100%;min-height:46px;border:0;border-bottom:2px solid var(--line-strong);border-radius:0;background:transparent;font-family:var(--f-hand);font-weight:600;font-size:29px;line-height:1;color:var(--bluepen);padding:2px 4px}

.ex-input.strike{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.ex-hand{font-family:var(--f-hand);font-weight:600;font-size:29px;line-height:1.1;color:var(--bluepen);border-bottom:2px solid var(--line-strong);padding:0 4px}
.ex-fix{font-family:var(--f-hand);font-weight:700;font-size:27px;line-height:1;color:var(--pen);white-space:nowrap}
.ex-ok{color:var(--ok);display:inline-grid}
.btn-say{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-weight:500;font-size:14.5px}
.btn-say .ic{width:18px;height:18px}
.form-msg{font-size:14.5px;color:var(--bad)}
.form-msg:empty{display:none}

/* nota del profe */
.res-top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.res-txt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.grade{flex:none;width:140px;height:118px;display:grid;place-items:center;color:var(--pen);font-family:var(--f-hand);font-weight:700;font-size:62px;line-height:1;border:3px solid var(--pen);border-radius:52% 48% 55% 45%/48% 55% 45% 52%;transform:rotate(-5deg)}
.grade small{font-size:32px}
.miss-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink)}
.miss .ic{width:16px;height:16px;color:var(--ink-3)}
.miss .muted{font-family:var(--f-body);font-weight:400;font-size:14px;justify-self:end}

/* practicar */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:132px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.mode:hover:not([disabled]){border-color:var(--line-strong)}
.mode[disabled]{opacity:.6}
.ic-wrap{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mk,var(--surface-2));color:var(--hl-ink);flex:none}
.mode-t{font-weight:600;font-size:16px;line-height:1.3}
.mode-s{font-size:13.5px;color:var(--ink-3);line-height:1.4}
.done-badge{position:absolute;top:12px;right:12px;color:var(--ok);display:inline-grid}
.mode.wide{flex-direction:row;align-items:center;gap:14px;min-height:88px;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mode.wide .mode-txt{display:flex;flex-direction:column;gap:2px;flex:1}
.mode.wide>.ic{color:var(--ink-3)}
.reset{display:flex;justify-content:center}

.ses{display:flex;flex-direction:column;gap:16px}
.ses-top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .3s ease}
.ses-count{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.retry{color:var(--bad)}
.q-card{padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.q-label{font-size:14.5px;color:var(--ink-2);font-weight:500}
.q-word-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q-word{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1.05;letter-spacing:-.02em}
.q-word-es{font-size:clamp(32px,9vw,44px)}
.q-sub{color:var(--ink-3);font-size:15px}
.q-sentence{font-size:21px;line-height:1.55;font-weight:500}
.blank{display:inline-block;width:4.4em;border-bottom:3px solid var(--ink);margin-inline:.12em;height:1.05em;vertical-align:-.12em}
.hint{color:var(--ink-3);font-weight:500}
.q-es{font-size:14.5px;color:var(--ink-3)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;min-height:60px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);transition:transform .08s,border-color .15s,background-color .15s}

.opt.is-right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt-k{position:absolute;top:5px;left:9px;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--ink-3)}

.type-area{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.03em}
.answer{width:100%;min-height:58px;padding:10px 16px;border-radius:14px;border:2px solid var(--line-strong);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:23px}
.answer::placeholder{color:var(--ink-3);opacity:.7;font-weight:500}
.answer:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.answer.is-right{border-color:var(--ok);background:var(--ok-bg)}
.answer.is-wrong{border-color:var(--bad);background:var(--bad-bg)}

.ses-actions{display:flex;flex-direction:column;gap:8px}
.fb{padding:14px 16px;border-radius:14px;border:1px solid;display:flex;flex-direction:column;gap:7px;animation:fbIn .22s ease-out}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb-title{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px}
.fb.ok .fb-title{color:var(--ok)}
.fb.bad .fb-title{color:var(--bad)}
.fb-ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.fb-ans .mk{font-family:var(--f-display);font-weight:800;font-size:20px}
.fb-note,.fb-sent{font-size:15px;color:var(--ink-2)}
.fb-sent-es{display:block;font-size:14px;color:var(--ink-3)}
.fb-diff{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);letter-spacing:.04em}
.dx{color:var(--bad);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
@keyframes fbIn{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn-listen{display:inline-flex;align-items:center;gap:10px;min-height:64px;padding:12px 24px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:18px}
.btn-listen .ic{width:28px;height:28px}

/* tarjetas */
.flash{perspective:1400px}
.flash-inner{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;padding:24px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:280px}
.face.front{justify-content:center;cursor:pointer}
.face.back{transform:rotateY(180deg)}
.flash:not(.flipped) .back,.flash.flipped .front{pointer-events:none}
.flash-ask{margin-top:6px;font-size:15px;color:var(--ink-2);font-weight:500}
.flash-sent{font-size:17px}
.flash-tip{font-size:14.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

/* parejas */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col{display:flex;flex-direction:column;gap:10px}
.m-item{min-height:56px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:600;font-size:15.5px;line-height:1.25;color:var(--ink);transition:border-color .15s,background-color .15s,opacity .2s}
.m-item.en{font-family:var(--f-display);font-weight:800;font-size:19px}
.m-item.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 13%,var(--surface))}
.m-item.done{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok);opacity:.75}
.m-item.miss{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:360px){
  .tiles{gap:5px}
  .tile-past{font-size:14px}
  .opt{font-size:18px}
}

const pickOne = a => a[Math.floor(Math.random() * a.length)];

function lev(a, b) {
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
/* marca en la palabra correcta las letras que faltaron o se escribieron mal */
function diffMarkup(user, correct) {
  const n = user.length, m = correct.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = user[i] === correct[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (j < m) {
    if (i < n && user[i] === correct[j]) { out += esc(correct[j]); i++; j++; }
    else if (i < n && dp[i + 1][j] >= dp[i][j + 1]) { i++; }
    else { out += '<span class="dx">' + esc(correct[j]) + "</span>"; j++; }
  }
  return out;
}
function diagnose(v, a) {
  if (a === v.past) return null;
  if (v.id === "buy" && a === "brought") return "«brought» es el pasado de bring (traer). Comprar es bought, sin r.";
  if (a === "chosen") return "«chosen» es el participio (I have chosen). El pasado simple es chose, con una sola o.";
  if (a === v.base + "s" || a === v.base + "es") return "Con -s es presente (he/she/it). El pasado no lleva -s: " + v.past + ".";
  if (a === v.base && v.base !== v.past) return "Esa es la forma del presente. En pasado cambia: " + v.past + ".";
  if (/ed$/.test(a)) return "Este verbo es irregular: no lleva -ed. Su pasado es " + v.past + ".";
  const other = VERBS.find(x => x.past === a && x.id !== v.id);
  if (other) return "«" + a + "» es el pasado de " + other.base + " (" + other.short + "). Aquí va " + v.past + ".";
  return null;
}

function playList(kind, items) {

  const next = () => {
    if (tk !== PL.token || !PL.on) return;

    paintPlaying(k);
    const el = $('[data-pl="' + k + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    say(items[k], { queue: true, rate: 0.85, onend: () => setTimeout(next, 300) });
  };
  try { speechSynthesis.cancel(); } catch (e) {}
  refreshPlayButtons();
  next();
}

/* ============ RONDAS DE PRÁCTICA ============ */
function pickSent(v, used) {
  const all = v.s.map((_, i) => i);
  let pool = used ? all.filter(i => !used.has(v.id + ":" + i)) : all;
  if (!pool.length) pool = all;
  const i = pickOne(pool);
  if (used) used.add(v.id + ":" + i);
  return v.s[i];
}
const optsFor = v => shuffle([v.past].concat(shuffle(v.wrong).slice(0, 3)));
function whichOpts(v) {
  const bad = CONFUSE[v.id] || [];
  const others = VERBS.filter(x => x.id !== v.id && bad.indexOf(x.id) < 0);
  return shuffle([v.past].concat(shuffle(others).slice(0, 3).map(x => x.past)));
}
const qBase = (v, kind, used) => ({ kind, prompt: "base", vid: v.id, options: kind === "choice" ? optsFor(v) : null, ex: pickSent(v, used) });
const qEs = (v, used) => ({ kind: "type", prompt: "es", vid: v.id, ex: pickSent(v, used) });
const qSent = (v, kind, used, hint) => ({ kind, prompt: "sentence", vid: v.id, sent: pickSent(v, used), hint: hint || "en", options: kind === "choice" ? optsFor(v) : null });
const qWhich = (v, used) => ({ kind: "choice", prompt: "which", vid: v.id, sent: pickSent(v, used), options: whichOpts(v) });
const qAudio = (v, used) => ({ kind: "type", prompt: "audio", vid: v.id, ex: pickSent(v, used) });
const qFlash = (v, used) => ({ kind: "flash", vid: v.id, sent: pickSent(v, used) });

function buildQuestions(mode, opts) {
  const used = new Set(), all = VERBS.map(v => v.id);
  switch (mode) {
    case "flash": return shuffle(VERBS).map(v => qFlash(v, used));
    case "elige": return shuffle(VERBS).map((v, i) => i % 2 ? qBase(v, "choice", used) : qSent(v, "choice", used));
    case "frases": {
      const a = shuffle(VERBS), qs = [];
      a.slice(0, 4).forEach(v => qs.push(qSent(v, "choice", used)));
      a.slice(4).forEach((v, i) => qs.push(qSent(v, "type", used, i % 3 === 2 ? "es" : "en")));
      shuffle(VERBS).slice(0, 3).forEach(v => qs.push(qWhich(v, used)));
      return qs;
    }
    case "escribe": return shuffle(shuffle(VERBS).map((v, i) => i < 7 ? qBase(v, "type", used) : qEs(v, used)));
    case "dictado": return shuffle(VERBS).map(v => qAudio(v, used));
    case "parejas": { const a = shuffle(all); return [{ kind: "match", pairs: a.slice(0, 5) }, { kind: "match", pairs: a.slice(5) }]; }
    case "historia": return STORY.map((l, n) => ({ kind: "type", prompt: "story", vid: l.vid, sent: [l.en, l.es], n, hint: "en" }));
    case "verb": { const v = V[opts.vid]; return [qBase(v, "choice", used), qSent(v, "choice", used), qSent(v, "type", used), qEs(v, used), qSent(v, "type", used, "es"), qBase(v, "type", used)]; }
    case "errores":
    case "lista": {
      let ids = mode === "lista" ? (opts.ids || []).filter(id => V[id]) : weakIds();
      if (!ids.length) ids = weakFirst(all).slice(0, 3);
      ids = ids.slice(0, 6);
      const qs = [];
      ids.forEach(id => { const v = V[id]; qs.push(qSent(v, "type", used), qBase(v, "type", used)); });
      if (ids.length < 3) ids.forEach(id => qs.push(qSent(V[id], "choice", used)));
      return shuffle(qs);
    }
  }
  return [];
}

const cur = () => SES.qs[SES.i];
function startSession(mode, opts) {
  opts = opts || {};

  const qs = buildQuestions(mode, opts).map((q, i) => Object.assign({ key: "q" + i }, q));
  if (!qs.length) return;
  if (S.view !== "session" && S.view !== "result") S.stack.push({ view: S.view, params: S.params, y: window.scrollY });
  SES = { mode, opts, qs, i: 0, log: [] };

}
function prepQ() {
  const q = cur();

  SES.match = q.kind === "match" ? { L: shuffle(q.pairs), R: shuffle(q.pairs), sel: null, done: new Set(), miss: new Set() } : null;
}
const sesTitle = () => MODE_TITLE[SES.mode] + (SES.mode === "verb" ? ": " + V[SES.opts.vid].base : "");
const OK_TITLES = ["¡Correcto!", "¡Bien!", "¡Eso es!", "¡Exacto!"];

function finishQ(ok, user, extra) {

  SES.log.push({ vid: q.vid, ok, retry: !!q.retry });

function pickOpt(val) {

function tapMatch(side, id, el) {

  const a = M.sel; M.sel = null;

    const n = M.miss.size;
    h += '<div class="fb ' + (fb.ok ? "ok" : "bad") + '" id="fb"><p class="fb-title">' + ic(fb.ok ? "check" : "x") + " " + (fb.ok ? "¡Todas a la primera!" : n === 1 ? "Completado con 1 error" : "Completado con " + n + " errores") + "</p>" +
      (n ? '<p class="fb-note">Repasa: ' + Array.from(M.miss).map(id => esc(V[id].short) + ' = <b lang="en">' + V[id].past + "</b>").join(" · ") + "</p>" : "") + "</div>" +
      '<div class="ses-actions"><button type="button" class="btn btn-block btn-ok" id="btn-next" data-action="next">Continuar ' + ic("arrowR") + "</button></div>";
  }
  return h;
}

/* ---------- simulacro: calificar ---------- */
function gradeExam() {
  if (!EXAM || EXAM.graded) return;
  $$(".ex-input").forEach(el => { EXAM.answers[el.dataset.vid] = el.value; });
  const empty = EXAM.order.filter(id => !norm(EXAM.answers[id])).length;
  if (empty && !S.examArm) {
    S.examArm = true;
    S.examMsg = "Te falta" + (empty === 1 ? " 1 verbo" : "n " + empty + " verbos") + ". Si quieres calificar así, toca «Entregar y calificar» otra vez.";
    live.textContent = S.examMsg;
    const m = $("#exam-msg"); if (m) m.textContent = S.examMsg;
    const first = EXAM.order.find(id => !norm(EXAM.answers[id])), inp = first && $("#ex-" + first);
    if (inp) inp.focus();
    return;
  }
  let ok = 0; const res = {};
  EXAM.order.forEach(id => { const good = norm(EXAM.answers[id]) === V[id].past; res[id] = good; if (good) ok++; scoreVerb(id, good, "type"); });
  EXAM.graded = true; EXAM.res = res; EXAM.ok = ok; S.examMsg = ""; S.examArm = false;
  P.exams.push({ t: Date.now(), s: ok, f: EXAM.format });
  if (P.exams.length > 40) P.exams = P.exams.slice(-40);
  P.steps.exam = true; saveP();
  live.textContent = "Nota: " + ok + " de 10.";
  render(true);
}

/* ============ PINTAR ============ */
function renderTabbar() {
  const tabs = [["ruta", "Ruta", "route"], ["verbos", "Verbos", "book"], ["practicar", "Practicar", "target"]];
  $("#tabbar").innerHTML = '<div class="tabbar-inner">' + tabs.map(t => '<button type="button" class="tab" data-action="tab" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + ">" + ic(t[2]) + "<span>" + t[1] + "</span></button>").join("") + "</div>";
}
function render(toTop) {
  if (S.view === "session" && !SES) S.view = null;
  if (S.view === "result" && !S.lastResult) S.view = null;
  if (S.view === "exam" && !EXAM) newExam();
  let html;
  switch (S.view) {
    case "session": html = viewSession(); break;
    case "result": html = viewResult(); break;
    case "lesson": html = viewLesson(); break;
    case "verb": html = viewVerb(); break;
    case "story": html = viewStoryPage(); break;
    case "exam": html = viewExam(); break;
    default: html = S.tab === "verbos" ? viewVerbos() : S.tab === "practicar" ? viewPractice() : viewHome();
  }
  app.innerHTML = html;
  app.classList.toggle("no-tabs", !!S.view);
  $("#tabbar").hidden = !!S.view;
  renderTabbar();
  if (toTop) window.scrollTo(0, 0);
  afterRender();
}
function afterRender() {
  if (S.view !== "session" || !SES) return;
  const q = cur();
  if (SES.state === "ask" && q.kind === "type") {
    const inp = $("#ans");
    if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }
    if (q.prompt === "audio" && !SES.spoken) { SES.spoken = true; say(V[q.vid].base); }
  } else if (SES.state === "fb") {
    const b = $("#btn-next");
    if (b) { try { b.focus({ preventScroll: true }); } catch (e) {} if (b.scrollIntoView) b.scrollIntoView({ block: "nearest" }); }
  }
}

/* ============ EVENTOS ============ */
const ACT = {
  tab: el => setTab(el.dataset.tab),
  step: el => goStep(el.dataset.id),
  "step-replace": el => goStep(el.dataset.id, true),
  verb: el => openView("verb", { vid: el.dataset.vid }),
  back: () => back(),
  quit: () => back(),
  say: el => say(el.dataset.text),
  "say-slow": el => say(el.dataset.text, { rate: 0.6 }),
  play: el => {
    const k = el.dataset.kind;
    if (PL.on && PL.kind === k) { stopList(); return; }
    if (k === "story") playList(k, STORY.map(l => plain(l.en)));
    else playList(k, VERBS.map(v => v.base + ". " + v.past + "."));
  },
  seg: el => { stopList(true); S.verbSeg = el.dataset.seg; render(); },
  cover: () => { S.cover = !S.cover; S.revealed.clear(); render(); },
  reveal: el => { S.revealed.add(el.dataset.vid); say(V[el.dataset.vid].past); render(); },
  "story-cover": () => { stopList(true); S.storyCover = !S.storyCover; S.storyRevealed.clear(); render(); },
  "story-es": () => { stopList(true); S.storyEs = !S.storyEs; render(); },
  "story-reveal": el => { const i = Number(el.dataset.i); S.storyRevealed.add(i); say(V[STORY[i].vid].past); render(); },
  "toggle-es": () => { S.showEs = !S.showEs; render(); },
  mode: el => startSession(el.dataset.mode),
  "practice-verb": el => startSession("verb", { vid: el.dataset.vid }),
  lista: el => startSession("lista", { ids: el.dataset.ids.split(",") }),
  again: () => { const R = S.lastResult; if (R) startSession(R.mode, R.opts); },
  opt: el => pickOpt(el.dataset.val),
  check: () => checkType(false),
  giveup: () => checkType(true),
  next: () => nextQ(),
  flip: () => flipCard(),
  know: el => rateFlash(el.dataset.k === "1"),
  m: el => tapMatch(el.dataset.side, el.dataset.vid, el),
  "show-base": () => { if (SES) { SES.showBase = true; render(); } },
  "lesson-next": () => { S.params.page++; render(true); },
  "lesson-prev": () => { S.params.page--; render(true); },
  "lesson-done": () => { const L = LESSONS[S.params.id]; P.steps[S.params.id] = true; saveP(); goStep(L.next, true); },
  "exam-format": el => { if (!EXAM || EXAM.graded) return; newExam(el.dataset.f); render(); },
  "exam-grade": () => gradeExam(),
  "exam-new": () => { newExam(); render(true); },
  reset: () => {
    if (S.resetArm && Date.now() - S.resetArm < 6000) {
      P = freshP(); saveP(); EXAM = null; S.resetArm = 0; render(); live.textContent = "Progreso borrado.";
    } else {
      S.resetArm = Date.now(); render();
      setTimeout(() => { if (S.resetArm && Date.now() - S.resetArm >= 6000) { S.resetArm = 0; if (!S.view && S.tab === "practicar") render(); } }, 6100);
    }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ans" && SES) {
    SES.input = t.value;
    const m = $("#type-msg"); if (m && m.textContent) m.textContent = "";
  } else if (t.classList && t.classList.contains("ex-input") && EXAM && !EXAM.graded) {
    EXAM.answers[t.dataset.vid] = t.value;
    if (S.examArm) { S.examArm = false; S.examMsg = ""; const m = $("#exam-msg"); if (m) m.textContent = ""; }
  }
});
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  if (S.view === "session" && SES) {
    const q = cur();
    if (e.key === "Enter") {
      if (e.repeat || tag === "BUTTON" || tag === "A") return;
      if (SES.state === "ask" && q.kind === "type") { e.preventDefault(); checkType(false); }
      else if (SES.state === "ask" && q.kind === "flash") { e.preventDefault(); flipCard(); }
      else if (SES.state === "fb") { e.preventDefault(); nextQ(); }
    } else if (/^[1-4]$/.test(e.key) && tag !== "INPUT" && SES.state === "ask" && q.kind === "choice") {
      const b = $$(".opt")[Number(e.key) - 1]; if (b) b.click();
    } else if (e.key === " " && tag !== "INPUT" && tag !== "BUTTON" && SES.state === "ask" && q.kind === "flash") {
      e.preventDefault(); flipCard();
    }
    return;
  }
  if (S.view === "exam" && e.key === "Enter" && e.target.classList && e.target.classList.contains("ex-input")) {
    e.preventDefault();
    const ins = $$(".ex-input"), k = ins.indexOf(e.target);
    if (k > -1 && k < ins.length - 1) ins[k + 1].focus();
    else { const b = $('[data-action="exam-grade"]'); if (b) b.focus(); }
  }
});

/* ============ ARRANQUE ============ */
const app = $("#app"), live = $("#live");
try { document.documentElement.lang = "es"; } catch (e) {}
render(false);
</script>
