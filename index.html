<title>De Deal a Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lexend:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* Un solo mundo visual: noche espacial con colores de resaltador neón */
:root{
  --bg:#0E1135;--bg-2:#161A48;--bg-3:#1F2461;--bg-4:#2B3179;
  --line:#2C337E;--line-2:#3E4799;
  --ink:#F4F5FF;--ink-2:#C4C9F2;--ink-3:#959DDA;
  --y:#FFE14A;--b:#5CCBFF;--p:#FF70C0;--o:#FFB14E;--g:#7DEB6B;--v:#B09BFF;
  --on-neon:#11143D;
  --ok:#7DEB6B;--bad:#FF5C70;--pen:#FF6B5E;
  --focus:#FFE14A;
  --f-game:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding-inline:16px;min-height:100vh;overflow-x:hidden;
  background-color:#0E1135;
  background-image:
    radial-gradient(ellipse 80% 50% at 85% -5%,rgba(176,155,255,.28),transparent 70%),
    radial-gradient(ellipse 70% 40% at 0% 100%,rgba(92,203,255,.14),transparent 70%),
    radial-gradient(1.6px 1.6px at 22px 34px,#fff 60%,transparent 62%),
    radial-gradient(1.2px 1.2px at 140px 90px,rgba(255,255,255,.8) 60%,transparent 62%),
    radial-gradient(1px 1px at 200px 180px,rgba(255,255,255,.7) 60%,transparent 62%),
    radial-gradient(1.5px 1.5px at 80px 220px,rgba(255,241,170,.9) 60%,transparent 62%),
    radial-gradient(1px 1px at 250px 40px,rgba(255,255,255,.6) 60%,transparent 62%);
  background-size:100% 100vh,100% 100vh,280px 280px,280px 280px,280px 280px,280px 280px,280px 280px;
  background-repeat:no-repeat,no-repeat,repeat,repeat,repeat,repeat,repeat;
  color:#F4F5FF;font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0;background:none;padding:0}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
::selection{background:var(--y);color:var(--on-neon)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:22px;height:22px;flex:none}
h1,h2,h3{margin:0;font-family:var(--f-game);font-weight:400;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(30px,8vw,40px)}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
b,strong{font-weight:600}
.lead{color:var(--ink-2);max-width:60ch}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mk{background:var(--mk,var(--y));color:var(--on-neon);padding:.02em .26em .06em;border-radius:.25em .5em .3em .45em/.45em .3em .5em .3em;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.app{max-width:560px;margin-inline:auto;padding-block:16px calc(104px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:28px}
.view{display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* botones de juego con relieve */
.btn{--c:var(--y);--s:#B39A1C;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:16px;background:var(--c);color:var(--on-neon);font-family:var(--f-game);font-size:20px;letter-spacing:.02em;box-shadow:0 5px 0 var(--s);transition:transform .08s,box-shadow .08s,filter .15s;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--s)}
.btn .ic{width:22px;height:22px}
.btn-block{width:100%}
.btn-b{--c:var(--b);--s:#2B83AE}
.btn-p{--c:var(--p);--s:#B13F82}
.btn-g{--c:var(--g);--s:#44A038}
.btn-r{--c:var(--bad);--s:#A82A3C;color:#fff}
.btn-ghost{--c:var(--bg-3);--s:#080B26;color:var(--ink)}
.btn-sm{min-height:44px;padding:8px 16px;font-size:17px;border-radius:14px;box-shadow:0 4px 0 var(--s)}
.btn-sm .ic{width:19px;height:19px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;background:var(--bg-3);color:var(--ink-2);flex:none;box-shadow:0 3px 0 #080B26}
.icon-btn:hover{color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #080B26}
.icon-btn .ic{width:20px;height:20px}
.link{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:8px 4px;font-size:15px}

/* cabecera: rango y sonido */
.top{display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--f-game);font-size:20px;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;white-space:nowrap}
.wordmark .mk{font-family:var(--f-game);font-weight:400;padding:0 .25em}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line)}
.rank-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--v);color:var(--on-neon);flex:none}
.rank-badge .ic{width:24px;height:24px}
.rank-txt{flex:1;min-width:0}
.rank-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank-name{font-family:var(--f-game);font-size:19px}
.rank-xp{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{height:10px;border-radius:99px;background:var(--bg-4);overflow:hidden;margin-top:6px}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--v),var(--p));border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(14,17,53,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar-inner{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--ink-3);font-size:12px;font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--on-neon);background:var(--y)}

/* mapa */
.mission{display:flex;flex-direction:column;gap:6px}
.map{position:relative;width:100%;max-width:420px;margin-inline:auto}
.map-path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.map-path path{fill:none;stroke:var(--line-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 13;vector-effect:non-scaling-stroke}
.map-path path.done{stroke:var(--y)}
.node{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:132px}
.node-btn{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--nc,var(--bg-3));color:var(--on-neon);box-shadow:0 6px 0 rgba(0,0,0,.4),inset 0 -7px 0 rgba(0,0,0,.18);transition:transform .1s}
.node-btn:active{transform:translateY(3px)}
.node-btn .ic{width:34px;height:34px}
.node-num{position:absolute;top:-5px;right:-7px;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--bg);border:2px solid var(--nc);color:var(--ink);font-family:var(--f-game);font-size:14px;display:grid;place-items:center}
.node.locked .node-btn{background:var(--bg-3);color:var(--ink-3)}
.node.locked .node-num{border-color:var(--line-2);color:var(--ink-3)}
.node.current .node-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--nc);animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.28);opacity:0}}
.node-label{font-size:13px;font-weight:600;text-align:center;line-height:1.25;color:var(--ink-2)}
.node.current .node-label{color:var(--ink)}
.node.boss .node-btn{width:96px;height:96px;background:var(--bad);color:#fff}
.node.boss.locked .node-btn{background:var(--bg-3);color:var(--ink-3)}
.stars{display:flex;gap:2px}
.stars .ic{width:17px;height:17px}
.st-on{color:var(--y)}
.st-off{color:var(--bg-4)}
.planet{position:absolute;border-radius:50%;pointer-events:none}

/* hoja modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,7,25,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fadeIn .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:sheetIn .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:.5}to{opacity:1}}
.sheet-head{display:flex;align-items:center;gap:14px}
.game-ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--nc);color:var(--on-neon);flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.game-ic .ic{width:30px;height:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--mk,var(--bg-3));color:var(--on-neon);font-size:13px;font-weight:600}
.chip .ic{width:15px;height:15px}
.chip.dim{background:var(--bg-3);color:var(--ink-2)}

/* pantalla de juego */
.game{display:flex;flex-direction:column;gap:12px}
.hud{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:3px}
.hearts .ic{width:25px;height:25px}
.h-on{color:var(--bad)}
.h-off{color:var(--bg-4)}
.hearts.hurt{animation:shake .4s}
.score{margin-left:auto;font-family:var(--f-game);font-size:25px;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.combo{font-family:var(--f-game);font-size:17px;padding:5px 11px;border-radius:99px;background:var(--bg-3);color:var(--ink-3);min-width:50px;text-align:center;display:inline-flex;align-items:center;gap:4px;justify-content:center}
.combo .ic{width:16px;height:16px}
.combo.hot{background:var(--o);color:var(--on-neon)}
.combo.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.gbar{height:8px;border-radius:99px;background:var(--bg-3);overflow:hidden}
.gbar>span{display:block;height:100%;background:var(--g);border-radius:inherit;transition:width .25s linear}
.gbar.time>span{background:var(--y)}
.gbar.low>span{background:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.float{position:absolute;font-family:var(--f-game);font-size:26px;color:var(--y);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;animation:floatUp .9s ease-out forwards}
.float.bad{color:var(--bad)}
@keyframes floatUp{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-130%) scale(1.1);opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c,var(--o));transition:transform .6s cubic-bezier(.1,.7,.3,1),opacity .6s ease-out}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:75}

/* campo de juego compartido */
.field{position:relative;overflow:hidden;border-radius:24px;height:min(52vh,460px);min-height:290px;border:1px solid var(--line-2);touch-action:manipulation;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 50% 125%,rgba(92,203,255,.3),transparent 60%),
    radial-gradient(1.4px 1.4px at 30px 40px,#fff 60%,transparent 62%),
    radial-gradient(1px 1px at 120px 150px,rgba(255,255,255,.75) 60%,transparent 62%),
    radial-gradient(1.2px 1.2px at 200px 70px,rgba(255,241,170,.9) 60%,transparent 62%),
    linear-gradient(#090C2B,#151B55);
  background-size:100% 100%,230px 230px,230px 230px,230px 230px,100% 100%;
  background-repeat:no-repeat,repeat,repeat,repeat,no-repeat}
.ground{position:absolute;left:-12%;right:-12%;bottom:-46px;height:86px;border-radius:50%;background:linear-gradient(#5CCBFF,#2B83AE);box-shadow:0 -6px 34px rgba(92,203,255,.5)}
.turret{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:56px;height:42px;color:var(--y)}
.laser{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.laser line{stroke:var(--y);stroke-width:5;stroke-linecap:round}
.meteor{position:absolute;top:0;left:50%;width:130px;height:130px;margin-left:-65px;will-change:transform;display:grid;place-items:center;pointer-events:none}
.meteor-tail{position:absolute;left:50%;bottom:58%;width:54px;height:120px;transform:translateX(-50%);background:linear-gradient(to top,rgba(255,177,78,.75),transparent);border-radius:50% 50% 0 0;filter:blur(5px)}
.meteor-rock{position:absolute;inset:18px;border-radius:46% 54% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 35% 30%,#FFD57E,#FF8A3D 45%,#B7401E 82%);box-shadow:0 0 32px rgba(255,138,61,.65)}
.meteor-word{position:relative;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.callout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:16px;background:var(--bad);color:#fff;font-family:var(--f-game);font-size:23px;white-space:nowrap;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.callout.ok{background:var(--g);color:var(--on-neon)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{position:relative;min-height:62px;border-radius:16px;background:var(--bg-3);color:var(--ink);font-weight:700;font-size:21px;box-shadow:0 5px 0 #080B26;transition:transform .08s,background-color .15s,box-shadow .08s}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #080B26}
.ans.right{background:var(--g);color:var(--on-neon)}
.ans.wrong{background:var(--bad);color:#fff}
.ans .k{position:absolute;top:5px;left:9px;font-size:11px;font-weight:500;color:var(--ink-3)}
@media (hover:none){.ans .k{display:none}}

/* globos */
.qcard{padding:16px 18px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.qcard .en{font-size:19px;font-weight:600;line-height:1.45}
.qcard .es{font-size:14px;color:var(--ink-3)}
.blank{display:inline-block;width:4.2em;border-bottom:3px solid var(--y);margin-inline:.12em;height:1em;vertical-align:-.1em}
.hint{color:var(--ink-3);font-weight:500}
.balloon{position:absolute;top:0;left:50%;width:100px;height:150px;margin-left:-50px;will-change:transform;display:flex;flex-direction:column;align-items:center}
.balloon-body{position:relative;width:100px;height:112px;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),transparent 30%),var(--c);display:grid;place-items:center;box-shadow:inset -9px -11px 0 rgba(0,0,0,.13);color:var(--on-neon);font-weight:700;font-size:18px;padding:8px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.balloon-body::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.balloon-string{width:2px;flex:1;background:rgba(255,255,255,.45);margin-top:8px}
.balloon.popped{pointer-events:none}
.balloon.popped .balloon-body,.balloon.popped .balloon-string{animation:pop .22s ease-out forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}

/* memoria */
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:9px}
.mem-card{aspect-ratio:3/4;perspective:900px}
.mem-card button{display:block;width:100%;height:100%;border-radius:14px}
.mem-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.mem-card.flip .mem-inner,.mem-card.matched .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:6px;text-align:center}
.mem-back{background:linear-gradient(135deg,var(--b),var(--v));box-shadow:0 4px 0 #2B3179}
.mem-back .ic{width:26px;height:26px;color:#fff}
.mem-front{transform:rotateY(180deg);background:var(--bg-3);font-weight:700;font-size:14.5px;line-height:1.15;color:var(--ink);border:2px solid var(--line-2)}
.mem-card.matched .mem-front{background:var(--g);color:var(--on-neon);border-color:var(--g)}
.mem-card.matched{opacity:.55}
.mem-card.bad .mem-front{background:var(--bad);color:#fff;border-color:var(--bad)}

/* deletrea */
.big-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big-word{font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1}
.slots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,54px));gap:8px;justify-content:center}
.slot{aspect-ratio:54/62;width:100%;border-radius:14px;border:3px dashed var(--line-2);display:grid;place-items:center;font-weight:700;font-size:clamp(22px,7vw,30px);color:var(--ink);background:rgba(255,255,255,.03)}
.slot.filled{border-style:solid;border-color:var(--b);background:var(--bg-3)}
.slot.locked{border-style:solid;border-color:var(--g);background:rgba(125,235,107,.14);color:var(--g)}
.slot.bad{border-style:solid;border-color:var(--bad);background:rgba(255,92,112,.16);color:var(--bad)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:56px;height:60px;border-radius:14px;background:var(--y);color:var(--on-neon);font-weight:700;font-size:28px;box-shadow:0 5px 0 #B39A1C;transition:transform .08s,opacity .15s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #B39A1C}
.tile.used{opacity:.15;box-shadow:none}

/* verdadero o falso */
.vf-card{padding:26px 18px;border-radius:26px;background:var(--bg-2);border:2px solid var(--line-2);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:210px;justify-content:center;transition:border-color .15s,background-color .15s}
.vf-pair{font-weight:700;font-size:clamp(30px,9vw,44px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;line-height:1.1}
.vf-pair .ic{width:30px;height:30px;color:var(--ink-3)}
.vf-q{font-size:15px;color:var(--ink-2)}
.vf-card.ok{border-color:var(--g);background:rgba(125,235,107,.1)}
.vf-card.bad{border-color:var(--bad);background:rgba(255,92,112,.1)}
.vf-fix{font-family:var(--f-game);font-size:20px;color:var(--g)}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf-btns .btn{min-height:80px;font-size:25px}
.timer{font-family:var(--f-game);font-size:26px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

/* jefe final */
.arena{position:relative;border-radius:24px;padding:14px 14px 16px;background:radial-gradient(ellipse at 50% 100%,rgba(255,92,112,.24),transparent 65%),var(--bg-2);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
.boss{width:min(40vw,156px);height:auto;animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.boss.hit{animation:hit .4s}

.achs{display:flex;flex-direction:column;gap:10px}

function lev(a, b) {
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
/* true si `a` (ya pasado por norm()) es una forma de pasado aceptada para v: la principal o, si
   existe (como dream → dreamt/dreamed), la alterna. */
function isCorrectPast(v, a) { return a === v.past || (v.altPast && a === v.altPast); }
function diagnose(v, a) {
  if (isCorrectPast(v, a)) return null;
  if (v.id === "buy" && a === "brought") return "«brought» es el pasado de bring (traer). Comprar es bought, sin r.";
  if (a === "chosen") return "«chosen» es el participio. El pasado simple es chose, con una sola o.";
  if (v.part && (a === v.part || a === v.altPart) && v.part !== v.past) return "«" + a + "» es el participio. El pasado simple es " + v.past + ".";
  if (a === v.base + "s" || a === v.base + "es") return "Con -s es presente. El pasado no lleva -s: " + v.past + ".";
  if (a === v.base && v.base !== v.past) return "Esa es la forma del presente. En pasado cambia: " + v.past + ".";
  if (/ed$/.test(a) && a !== v.altPast) return "Este verbo es irregular: no lleva -ed. Su pasado es " + v.past + ".";
  const other = VERBS.find(x => x.past === a && x.id !== v.id);
  if (other) return "«" + a + "» es el pasado de " + other.base + " (" + other.short + "). Aquí va " + v.past + ".";
  return null;
}
function markPast(v, w) { return '<mark class="mk" style="--mk:' + T[v.type].color + '" lang="en">' + esc(w || v.past) + "</mark>"; }
function sentMarked(en, v) { return esc(en).replace(/\{(.+?)\}/, (_, w) => markPast(v, w)); }
function sentBlank(en, fill, hint, v) {
  return esc(en).replace(/\{(.+?)\}/, () => fill ? markPast(v, fill) : '<span class="blank" role="img" aria-label="espacio en blanco"></span>' + (hint ? ' <span class="hint">(' + esc(hint) + ")</span>" : ""));
}

/* ============ SONIDO SINTETIZADO (sin archivos externos) ============ */
const AC = { ctx: null };
function actx() {
  if (!AC.ctx) { try { AC.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC.ctx && AC.ctx.state === "suspended") { try { AC.ctx.resume(); } catch (e) {} }
  return AC.ctx;
}
function tone(ctx, freq, start, dur, type, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(vol == null ? 0.16 : vol, start + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start + dur + 0.03);
}
function sfx(name) {
  if (!P.sound) return;
  const ctx = actx(); if (!ctx) return;
  const t = ctx.currentTime;
  if (name === "tap") tone(ctx, 520, t, 0.06, "sine", 0.1);
  else if (name === "correct") { tone(ctx, 660, t, 0.09, "triangle", 0.16); tone(ctx, 880, t + 0.08, 0.15, "triangle", 0.16); }
  else if (name === "wrong") { tone(ctx, 220, t, 0.16, "sawtooth", 0.13); tone(ctx, 160, t + 0.09, 0.18, "sawtooth", 0.11); }
  else if (name === "pop") { tone(ctx, 940, t, 0.05, "square", 0.09); tone(ctx, 520, t + 0.04, 0.08, "square", 0.08); }
  else if (name === "explode") { tone(ctx, 140, t, 0.22, "sawtooth", 0.15); tone(ctx, 90, t + 0.05, 0.24, "square", 0.12); }
  else if (name === "star") [523, 659, 784].forEach((f, i) => tone(ctx, f, t + i * 0.09, 0.16, "triangle", 0.14));
  else if (name === "victory") [523, 659, 784, 1046].forEach((f, i) => tone(ctx, f, t + i * 0.1, 0.22, "triangle", 0.16));
  else if (name === "hurt") tone(ctx, 180, t, 0.14, "square", 0.14);
  else if (name === "lose") [400, 340, 280, 220].forEach((f, i) => tone(ctx, f, t + i * 0.11, 0.18, "sawtooth", 0.13));
  else if (name === "unlock") [784, 988, 1175].forEach((f, i) => tone(ctx, f, t + i * 0.08, 0.15, "sine", 0.14));
  else if (name === "timeout") tone(ctx, 150, t, 0.2, "square", 0.13);
  else if (name === "click") tone(ctx, 440, t, 0.05, "sine", 0.08);
}

function pickVoice() {
  try {
    const en = (speechSynthesis.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang));
    TTS.voice = en.find(v => /en[-_]US/i.test(v.lang) && /(Google|Samantha|Aria|Jenny|Natural)/i.test(v.name)) || en.find(v => /en[-_]US/i.test(v.lang)) || en[0] || null;

const PL = { on: false, token: 0, kind: "" };

function playList(kind, items) {
  if (!TTS.ok || !P.sound) return;
  stopList(true);
  const tk = ++PL.token; PL.on = true; PL.kind = kind;
  let k = -1;
  const next = () => {
    if (tk !== PL.token || !PL.on) return;
    k++;
    if (k >= items.length) { PL.on = false; PL.kind = ""; paintPlaying(-1); refreshPlayButtons(); return; }
    paintPlaying(k);
    const el = $('[data-pl="' + k + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    say(items[k], { queue: true, rate: 0.85, onend: () => setTimeout(next, 300) });
  };
  try { speechSynthesis.cancel(); } catch (e) {}
  refreshPlayButtons();
  next();
}
function stopList(silent) {
  if (!PL.on) return;
  PL.on = false; PL.kind = ""; PL.token++;
  try { speechSynthesis.cancel(); } catch (e) {}

  if (!silent) refreshPlayButtons();
}

/* ============ EFECTOS VISUALES ============ */
const FXLAYER = document.getElementById("fx");
function floatText(text, xPct, yPct, bad) {
  if (!FXLAYER) return;
  const el = document.createElement("div");
  el.className = "float" + (bad ? " bad" : "");
  el.style.left = xPct + "%"; el.style.top = yPct + "%";
  el.textContent = text;
  FXLAYER.appendChild(el);
  const done = () => { if (el.parentNode) el.remove(); };
  el.addEventListener("animationend", done, { once: true });
  setTimeout(done, 1400);
}
function sparkBurst(xPct, yPct, color, n) {
  if (!FXLAYER || REDUCE) return;
  const count = n || 14;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "spark"; el.style.left = xPct + "%"; el.style.top = yPct + "%";
    el.style.setProperty("--c", color || "var(--o)");
    FXLAYER.appendChild(el);
    const ang = Math.random() * Math.PI * 2, dist = 36 + Math.random() * 90;
    requestAnimationFrame(() => { el.style.transform = "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px)"; el.style.opacity = "0"; });
    setTimeout(() => { if (el.parentNode) el.remove(); }, 650);
  }
}
function confettiBurst(n) {
  const layer = document.getElementById("confetti");
  if (!layer || REDUCE) return;
  const colors = ["var(--y)", "var(--b)", "var(--p)", "var(--o)", "var(--g)", "var(--v)"];
  const count = n || 70, w = window.innerWidth, h = window.innerHeight;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    const size = 6 + Math.random() * 6;
    el.style.cssText = "position:absolute;top:-20px;border-radius:" + (Math.random() < 0.5 ? "50%" : "3px") + ";width:" + size + "px;height:" + (size * (0.6 + Math.random() * 0.8)) + "px;background:" + colors[i % colors.length] + ";left:" + Math.random() * w + "px;opacity:.95";
    layer.appendChild(el);
    const dur = 1800 + Math.random() * 1400, rot = Math.random() * 720 - 360, drift = Math.random() * 160 - 80;
    let anim;
    try {
      anim = el.animate([
        { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + drift + "px," + (h + 40) + "px) rotate(" + rot + "deg)", opacity: .9, offset: .85 },
        { transform: "translate(" + drift + "px," + (h + 60) + "px) rotate(" + rot + "deg)", opacity: 0 }
      ], { duration: dur, easing: "cubic-bezier(.2,.6,.4,1)" });
      anim.onfinish = () => el.remove();
    } catch (e) {}
    setTimeout(() => { if (el.parentNode) el.remove(); }, dur + 250);
  }
}
function shakeEl(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 450); }
function toast(html, ms) {
  const el = document.createElement("div");
  el.className = "toast"; el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s, transform .3s"; el.style.opacity = "0"; el.style.transform = "translate(-50%,-14px)"; setTimeout(() => el.remove(), 320); }, ms || 2600);
}

/* ============ ESTADO PERSISTENTE (progreso del juego) ============ */
const GKEY = "de-burst-a-crept:game:v1";
const freshState = () => ({ xp: 0, levels: {}, dex: {}, ach: {}, arcade: {}, bestCombo: 0, bossNoHint: false, sound: true });
function loadState() {
  try {
    const raw = localStorage.getItem(GKEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") return Object.assign(freshState(), p, { levels: p.levels || {}, dex: p.dex || {}, ach: p.ach || {}, arcade: p.arcade || {} });
    }
  } catch (e) {}
  return freshState();
}
function saveState() { try { localStorage.setItem(GKEY, JSON.stringify(P)); } catch (e) {} }
let P = loadState();

function bumpDex(vid, ok) { const cur = P.dex[vid] || 0; P.dex[vid] = ok ? Math.min(4, cur + 1) : Math.max(0, cur - 1); }
function dexLevel(vid) { const n = P.dex[vid] || 0; return n >= 3 ? 2 : n > 0 ? 1 : 0; }
const DEX_LABEL = ["nuevo", "aprendiendo", "dominado"];
const masteredCount = () => VERBS.filter(v => (P.dex[v.id] || 0) >= 3).length;

function rankInfo(xp) {
  let cur = RANKS[0];
  for (let i = 0; i < RANKS.length; i++) if (xp >= RANKS[i].xp) cur = RANKS[i];
  const idx = RANKS.indexOf(cur), nxt = idx < RANKS.length - 1 ? RANKS[idx + 1] : null;
  const span = nxt ? nxt.xp - cur.xp : 1;
  const prog = nxt ? Math.max(0, Math.min(1, (xp - cur.xp) / span)) : 1;
  return { cur, next: nxt, prog };
}
function checkAchievements() {
  const unlocked = [];
  ACHIEVEMENTS.forEach(a => { if (!P.ach[a.id] && a.check(P)) { P.ach[a.id] = true; unlocked.push(a); } });
  if (unlocked.length) saveState();
  return unlocked;
}
function starsFor(acc, failed) { if (failed) return 0; if (acc >= 0.9) return 3; if (acc >= 0.7) return 2; return 1; }
function isUnlocked(levelId) { if (levelId <= 1) return true; const prev = P.levels[levelId - 1]; return !!(prev && prev.stars >= 1); }
function recordLevelResult(levelId, correct, total, failed, xpEarned) {
  const prevBest = P.levels[levelId] ? P.levels[levelId].stars : 0;
  const acc = total ? correct / total : 0;
  const stars = starsFor(acc, failed);
  const wasPerfect = (P.levels[levelId] && P.levels[levelId].perfect) || (!failed && total > 0 && acc >= 1);
  P.levels[levelId] = { stars: Math.max(stars, prevBest), best: Math.max(correct, (P.levels[levelId] && P.levels[levelId].best) || 0), perfect: wasPerfect, tries: ((P.levels[levelId] && P.levels[levelId].tries) || 0) + 1 };
  P.xp += Math.max(0, xpEarned);
  saveState();
  return { stars, isNew: stars > prevBest, prevBest };
}

/* ============ GENERACIÓN DE PREGUNTAS ============ */
function distractorsFor(v, n) {
  const own = shuffle(v.wrong.slice());
  const others = shuffle(VERBS.filter(x => x.id !== v.id && (CONFUSE[v.id] || []).indexOf(x.id) < 0).map(x => x.past));
  const pool = [];
  own.forEach(w => { if (pool.length < n && pool.indexOf(w) < 0 && w !== v.past) pool.push(w); });
  let oi = 0; while (pool.length < n && oi < others.length) { const w = others[oi++]; if (pool.indexOf(w) < 0 && w !== v.past) pool.push(w); }
  return pool.slice(0, n);
}
const optsFor = v => shuffle([v.past].concat(distractorsFor(v, 3)));
function tfCandidate(v, wantTrue) {
  if (wantTrue) return v.past;
  const pool = shuffle(v.wrong.slice());
  if (pool.length) return pool[0];
  const others = VERBS.filter(x => x.id !== v.id);
  return pickOne(others).past;
}
function questionVids(vids, count) {
  const out = []; let pool = [];
  while (out.length < count) { if (!pool.length) pool = shuffle(vids); out.push(pool.pop()); }
  return out;
}
function buildSession(level) {
  const vids = level.vids, game = level.game;
  if (game === "meteors") return questionVids(vids, 10).map(vid => ({ vid, options: optsFor(V[vid]) }));
  if (game === "balloons") return questionVids(vids, 10).map(vid => ({ vid, options: optsFor(V[vid]), sent: pickOne(V[vid].s) }));
  if (game === "truefalse") { const seq = questionVids(vids, 10).map((vid, i) => { const wantTrue = i % 2 === 0; const shown = tfCandidate(V[vid], wantTrue); return { vid, shown, isTrue: shown === V[vid].past }; }); return shuffle(seq); }
  if (game === "spell") return questionVids(vids, Math.min(8, Math.max(4, vids.length * 2))).map(vid => ({ vid, sent: pickOne(V[vid].s) }));
  return [];
}
function buildMemoryBoard(vids) {
  const tiles = [];
  vids.forEach(vid => { const v = V[vid]; tiles.push({ key: vid + "-b", vid, kind: "base", label: v.base }); tiles.push({ key: vid + "-p", vid, kind: "past", label: v.past }); });
  return shuffle(tiles);
}

/* ============ SESIÓN DE JUEGO ============ */
let SESSION_ID = 0;
/* Todo setTimeout que toque SES debe capturar `SES.sid` y comprobar `!SES || SES.sid !== mySid` al disparar:
   si el jugador sale y empieza otra partida dentro de esa ventana, SES ya es un objeto distinto. */
function commonInitSES(game, vids, levelId, arcade) {
  SES = { sid: ++SESSION_ID, game, vids, levelId: levelId || null, arcade: !!arcade, hearts: 3, score: 0, combo: 0, maxCombo: 0, correctCount: 0, totalCount: 0, missed: new Set(), hintUsed: false, justHurt: false, resolved: false, picked: null, armedFor: -1 };
  if (game === "memory") { SES.board = buildMemoryBoard(vids); SES.flipped = []; SES.matched = new Set(); SES.badPair = null; }
  else if (game === "boss") { SES.bossHP = 10; SES.bossPool = shuffle(vids.slice()); SES.curVid = SES.bossPool.pop(); SES.typed = ""; SES.lastNote = null; SES.bossSay = null; SES.hitFx = false; }
  else { SES.qs = buildSession({ vids, game }); SES.i = 0; initQuestionState(); }
}
function initQuestionState() {
  SES.resolved = false; SES.picked = null; SES.timedOut = false; SES.justHurt = false;
  if (SES.game === "spell") {
    const v = V[SES.qs[SES.i].vid];
    SES.tiles = shuffle(v.past.split(""));
    SES.slots = new Array(v.past.length).fill(null);
    SES.usedTile = new Array(SES.tiles.length).fill(false);
    SES.spellBad = -1; SES.mistakes = 0;
  }
}
function applyAnswer(vid, ok, opts) {
  opts = opts || {};
  SES.totalCount++;
  bumpDex(vid, ok);
  if (ok) {
    SES.correctCount++; SES.combo++; SES.maxCombo = Math.max(SES.maxCombo, SES.combo);
    P.bestCombo = Math.max(P.bestCombo, SES.combo);
    const pts = 100 + Math.min(SES.combo - 1, 8) * 10;
    SES.score += pts; SES.lastPts = pts;
    sfx(opts.sfx || "correct");
  } else {
    SES.missed.add(vid); SES.combo = 0; SES.justHurt = true;
    SES.hearts = Math.max(0, SES.hearts - 1);
    sfx(opts.sfx || "wrong");
  }
  return ok;
}
function afterAnswerDelay(ok) {
  const delay = ok ? 650 : 1050, mySid = SES.sid;
  setTimeout(() => { if (!SES || SES.sid !== mySid) return; if (SES.hearts <= 0) endLevel(true); else advance(); }, delay);
}
function advance() {
  SES.i++;
  if (SES.i >= SES.qs.length) { endLevel(false); return; }
  initQuestionState();
  render();
}

/* ---------- temporizador central (independiente de la animación decorativa) ---------- */
function startTimer(ms, onDone) {
  SES.timerDone = false;
  const mySid = SES.sid;
  const fire = () => { if (!SES || SES.sid !== mySid || SES.timerDone) return; SES.timerDone = true; onDone(); };
  const bar = $("#gbar-fill");
  if (!bar) { SES.timerFallback = setTimeout(fire, ms); return; }
  bar.style.transition = "none"; bar.style.width = "100%";
  void bar.offsetWidth;
  const handler = () => { bar.removeEventListener("transitionend", handler); fire(); };
  bar.addEventListener("transitionend", handler);
  requestAnimationFrame(() => requestAnimationFrame(() => { if (!bar.isConnected) return; bar.style.transition = "width " + ms + "ms linear"; bar.style.width = "0%"; }));
  SES.timerFallback = setTimeout(() => { bar.removeEventListener("transitionend", handler); fire(); }, ms + 300);
}
function stopTimer() { if (!SES) return; SES.timerDone = true; if (SES.timerFallback) clearTimeout(SES.timerFallback); const bar = $("#gbar-fill"); if (bar) bar.style.transition = "none"; }
function timerDuration(game, i) { return game === "truefalse" ? Math.max(2200, 3600 - i * 130) : Math.max(3200, 6200 - i * 260); }
function onTimeout() {
  if (!SES || SES.resolved) return;
  SES.resolved = true; SES.timedOut = true;
  applyAnswer(SES.qs[SES.i].vid, false, { sfx: "timeout" });
  render();
  afterAnswerDelay(false);
}
function armMeteorFall(ms) {
  const el = $("#meteor"); if (!el) return;
  el.style.transition = "none"; el.style.top = "-14%";
  void el.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => { if (!el.isConnected) return; el.style.transition = "top " + ms + "ms linear"; el.style.top = "94%"; }));
}
function armBalloonsRise(ms) {
  $$(".balloon").forEach((el, i) => {
    el.style.transition = "none"; el.style.bottom = "-30%";
    void el.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!el.isConnected) return; el.style.transition = "bottom " + (ms + i * 140) + "ms linear"; el.style.bottom = "106%"; }));
  });
}

/* ============ MEMORIA ============ */
function memoryHTML() {
  const cols = SES.board.length <= 4 ? SES.board.length : 4;
  return hud(false) +
    '<p class="q-label" style="text-align:center">Empareja cada verbo con su pasado · ' + SES.matched.size + "/" + SES.vids.length + "</p>" +
    '<div class="mem-grid" style="--cols:' + cols + '">' + SES.board.map(t => {
      const matched = SES.matched.has(t.vid), up = matched || SES.flipped.indexOf(t.key) > -1, bad = SES.badPair && SES.badPair.indexOf(t.key) > -1;
      return '<div class="mem-card' + (up ? " flip" : "") + (matched ? " matched" : "") + (bad ? " bad" : "") + '"><button type="button" data-action="mem-flip" data-key="' + t.key + '"' + (up ? " disabled" : "") + ' aria-label="' + (up ? esc(t.label) : "Carta boca abajo") + '"><div class="mem-inner"><div class="mem-face mem-back">' + ic("cards") + '</div><div class="mem-face mem-front" lang="en">' + esc(t.label) + "</div></div></button></div>";
    }).join("") + "</div>";
}
function memFlip(key) {
  if (!SES || SES.badPair) return;
  if (SES.flipped.indexOf(key) > -1 || SES.flipped.length >= 2) return;
  const tile = SES.board.find(t => t.key === key);
  if (!tile || SES.matched.has(tile.vid)) return;
  SES.flipped.push(key);
  sfx("tap");
  render();
  if (SES.flipped.length === 2) {
    const [k1, k2] = SES.flipped, t1 = SES.board.find(t => t.key === k1), t2 = SES.board.find(t => t.key === k2);
    if (t1.vid === t2.vid && t1.kind !== t2.kind) {
      SES.matched.add(t1.vid); SES.flipped = [];
      applyAnswer(t1.vid, true);
      sparkBurst(50, 45, "var(--g)", 14);
      render();
      if (SES.matched.size >= SES.vids.length) { const mySid = SES.sid; setTimeout(() => { if (SES && SES.sid === mySid) endLevel(false); }, 500); }
    } else {
      SES.badPair = [k1, k2];
      SES.totalCount++; SES.combo = 0; SES.justHurt = true; SES.hearts = Math.max(0, SES.hearts - 1);
      bumpDex(t1.vid, false); bumpDex(t2.vid, false);
      SES.missed.add(t1.vid); SES.missed.add(t2.vid);
      sfx("wrong");
      render();
      const mySid = SES.sid;
      setTimeout(() => { if (!SES || SES.sid !== mySid) return; SES.flipped = []; SES.badPair = null; SES.justHurt = false; if (SES.hearts <= 0) endLevel(true); else render(); }, 900);
    }
  }
}

/* ============ DELETREA ============ */
function spellHTML() {
  const q = SES.qs[SES.i], v = V[q.vid], n = v.past.length;
  return hud(false) +
    '<div class="qcard"><p class="q-label">Arma el pasado de <b lang="en">' + v.base + "</b></p><p class=\"q-es\">" + esc(v.es) + ' · "' + esc(q.sent[1]) + '"</p></div>' +
    '<div class="slots" style="--n:' + n + '">' + SES.slots.map((ch, i) => '<div class="slot' + (ch ? " filled" : "") + (SES.spellBad === i ? " bad" : "") + (SES.resolved ? " locked" : "") + '">' + (ch ? esc(ch) : "") + "</div>").join("") + "</div>" +
    '<div class="tray">' + SES.tiles.map((ch, i) => '<button type="button" class="tile' + (SES.usedTile[i] ? " used" : "") + '" data-action="spell-tile" data-i="' + i + '"' + (SES.usedTile[i] || SES.resolved ? " disabled" : "") + ">" + esc(ch) + "</button>").join("") + "</div>" +
    (SES.resolved ? "" : '<button type="button" class="link" data-action="spell-hint" style="align-self:center">' + ic("bulb") + " Pista: revelar una letra</button>");
}
function spellTile(i) {
  if (!SES || SES.resolved) return;
  const q = SES.qs[SES.i], v = V[q.vid];
  if (SES.usedTile[i]) return;
  const ch = SES.tiles[i], nextIdx = SES.slots.findIndex(s => s === null);
  if (nextIdx === -1) return;
  if (ch === v.past[nextIdx]) {
    SES.slots[nextIdx] = ch; SES.usedTile[i] = true; SES.spellBad = -1;
    sfx("tap");
    if (SES.slots.every(s => s !== null)) { SES.resolved = true; applyAnswer(v.id, true); sparkBurst(50, 40, "var(--g)", 18); render(); afterAnswerDelay(true); }
    else render();
  } else {
    SES.spellBad = nextIdx; SES.mistakes = (SES.mistakes || 0) + 1;
    shakeEl($(".slots")); sfx("wrong");
    if (SES.mistakes >= 3) { SES.resolved = true; applyAnswer(v.id, false); SES.slots = v.past.split(""); render(); afterAnswerDelay(false); }
    else { const mySid = SES.sid; render(); setTimeout(() => { if (SES && SES.sid === mySid && !SES.resolved) { SES.spellBad = -1; render(); } }, 420); }
  }
}
function spellHint() {
  if (!SES || SES.resolved) return;
  const q = SES.qs[SES.i], v = V[q.vid], nextIdx = SES.slots.findIndex(s => s === null);
  if (nextIdx === -1) return;
  const ch = v.past[nextIdx], ti = SES.tiles.findIndex((c, idx) => c === ch && !SES.usedTile[idx]);
  if (ti > -1) SES.usedTile[ti] = true;
  SES.slots[nextIdx] = ch; SES.hintUsed = true;
  sfx("tap");
  if (SES.slots.every(s => s !== null)) { SES.resolved = true; applyAnswer(v.id, true); sparkBurst(50, 40, "var(--g)", 18); render(); afterAnswerDelay(true); }
  else render();
}

/* ============ VERDADERO O FALSO ============ */
function tfHTML() {
  const q = SES.qs[SES.i], v = V[q.vid], cls = SES.resolved ? (q.isTrue ? " ok" : " bad") : "";
  return hud(true) +
    '<p class="q-label" style="text-align:center">¿Es correcto este pasado?</p>' +
    '<div class="vf-card' + cls + '"><div class="vf-pair" lang="en">' + v.base + ic("arrowR") + esc(q.shown) + '</div><p class="vf-q">' + esc(v.es) + "</p>" +
      (SES.resolved && !q.isTrue ? '<p class="vf-fix">Correcto: <span lang="en">' + v.past + "</span></p>" : "") +
    "</div>" +
    '<div class="vf-btns"><button type="button" class="btn btn-r" data-action="tf-ans" data-val="false"' + (SES.resolved ? " disabled" : "") + ">" + ic("x") + ' Falso</button><button type="button" class="btn btn-g" data-action="tf-ans" data-val="true"' + (SES.resolved ? " disabled" : "") + ">" + ic("check") + " Verdadero</button></div>";
}
function tfAnswer(valStr) {
  if (!SES || SES.resolved) return;
  const q = SES.qs[SES.i], v = V[q.vid];
  stopTimer(); SES.resolved = true; SES.picked = valStr;
  const ok = (valStr === "true") === q.isTrue;
  applyAnswer(v.id, ok);
  if (!ok) shakeEl($(".vf-card"));
  render();
  afterAnswerDelay(ok);
}

/* ============ JEFE FINAL ============ */
const BOSS_TAUNTS = ["¡Ja! Ese no es.", "Revisa la ortografía…", "¡Casi, pero no!", "El pasado es otro.", "¿Seguro? Intenta de nuevo."];
const BOSS_HITLINES = ["¡Auch!", "¡Buen disparo!", "¡Me diste!", "¡Eso duele!", "¡No otra vez!"];
function nextBossVid() { if (!SES.bossPool.length) SES.bossPool = shuffle(SES.vids.slice()); return SES.bossPool.pop(); }
function bossHTML() {
  const v = V[SES.curVid], dead = SES.bossHP <= 0;
  return hud(false) +
    '<div class="arena"><span class="boss-name">El Profesor del Vacío</span>' +
    '<svg class="boss' + (SES.hitFx ? " hit" : "") + (dead ? " dead" : "") + '" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--bad)">' +
      '<path d="M20 55c0-22 13-38 30-38s30 16 30 38c0 8-4 13-8 16l3 12H25l3-12c-4-3-8-8-8-16Z" fill="rgba(255,92,112,.18)"/>' +
      '<circle cx="38" cy="52" r="5" fill="currentColor" stroke="none"/><circle cx="62" cy="52" r="5" fill="currentColor" stroke="none"/>' +
      '<path d="M38 72h24"/><path d="M30 24c4-8 10-12 20-12s16 4 20 12"/>' +
    "</svg>" +
    '<div class="hp">' + Array.from({ length: 10 }).map((_, i) => '<i class="' + (i < SES.bossHP ? "" : "gone") + '"></i>').join("") + "</div>" +
    '<p class="boss-say">' + esc(SES.bossSay || "«A ver si te sabes este…»") + "</p></div>" +
    '<div class="qcard"><p class="q-label">Escribe el pasado de</p><div class="q-word-row"><span class="q-word" lang="en">' + v.base + "</span>" + sayBtn(v.base, "Escuchar " + v.base) + '</div><p class="q-sub">' + esc(v.es) + "</p></div>" +
    '<input id="boss-input" class="answer' + (SES.resolved && !SES.lastOk ? " bad" : "") + '" type="text" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Escribe aquí" value="' + esc(SES.typed || "") + '"' + (SES.resolved ? " disabled" : "") + ">" +
    (SES.resolved ? '<div class="qcard"><p class="fb-note">' + (SES.lastOk ? "¡Correcto! " : "Era: ") + '<b lang="en">' + v.past + "</b></p>" + (SES.lastNote ? '<p class="muted small">' + esc(SES.lastNote) + "</p>" : "") + "</div>" : "") +
    '<div class="stack">' + (SES.resolved ? '<button type="button" class="btn btn-block" data-action="next">Continuar ' + ic("arrowR") + "</button>" : '<button type="button" class="btn btn-block" data-action="boss-check">Disparar ' + ic("bolt") + '</button><button type="button" class="link" data-action="boss-hint" style="align-self:center">' + ic("bulb") + " Pista: primera letra</button>") + "</div>";
}
function bossCheck() {
  if (!SES || SES.resolved) return;
  const v = V[SES.curVid], inp = $("#boss-input"), raw = inp ? inp.value : SES.typed || "";
  SES.typed = raw;
  const a = norm(raw);
  if (!a) { shakeEl(inp); if (inp) inp.focus(); return; }
  const ok = isCorrectPast(v, a);
  SES.resolved = true; SES.lastOk = ok;
  applyAnswer(v.id, ok);
  if (ok) { SES.bossHP = Math.max(0, SES.bossHP - 1); SES.bossSay = pickOne(BOSS_HITLINES); SES.hitFx = true; sparkBurst(50, 32, "var(--y)", 16); }
  else { SES.lastNote = diagnose(v, a) || (lev(a, v.past) <= 2 ? "Muy cerca. Revisa la ortografía." : null); SES.bossSay = pickOne(BOSS_TAUNTS); shakeEl($(".arena")); }
  render();
  const mySid = SES.sid;
  setTimeout(() => { if (SES && SES.sid === mySid) SES.hitFx = false; }, 420);
}
function bossHint() {
  if (!SES || SES.resolved) return;
  const v = V[SES.curVid];
  SES.hintUsed = true; SES.typed = v.past[0];
  const inp = $("#boss-input"); if (inp) { inp.value = SES.typed; inp.focus(); }
  live.textContent = "Pista: empieza con " + v.past[0];
}
function bossNext() { SES.curVid = nextBossVid(); SES.resolved = false; SES.typed = ""; SES.lastNote = null; SES.bossSay = null; render(); }

/* ============ DESPACHO Y CICLO DE VIDA ============ */
function viewSession() {
  if (!SES) return "";
  if (SES.game === "meteors") return meteorsHTML();
  if (SES.game === "balloons") return balloonsHTML();
  if (SES.game === "memory") return memoryHTML();
  if (SES.game === "spell") return spellHTML();
  if (SES.game === "truefalse") return tfHTML();
  if (SES.game === "boss") return bossHTML();
  return "";
}
function afterRender() {
  if (S.view !== "play" || !SES) return;
  if (["meteors", "balloons", "truefalse"].indexOf(SES.game) > -1 && !SES.resolved && SES.armedFor !== SES.i) {
    SES.armedFor = SES.i;
    const dur = timerDuration(SES.game, SES.i);
    startTimer(dur, onTimeout);
    if (SES.game === "meteors") armMeteorFall(dur);
    if (SES.game === "balloons") armBalloonsRise(dur);
  }
  if (SES.game === "boss" && !SES.resolved) { const inp = $("#boss-input"); if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) {} } }
}
function startLevel(id) {
  const lv = LV[id]; if (!lv) return;
  closeSheet(); stopList(true);
  commonInitSES(lv.game, lv.vids, id, false);
  S.stack.push({ view: S.view, params: S.params, y: window.scrollY });
  S.view = "play"; S.params = {};
  render(true);
}
function startArcade(gameType, vids) {
  stopList(true);
  commonInitSES(gameType, vids || VERBS.map(v => v.id), null, true);
  S.stack.push({ view: S.view, params: S.params, y: window.scrollY });
  S.view = "play"; S.params = {};
  render(true);
}
function endLevel(failed) {
  stopTimer(); stopList(true);
  /* totalCount cuenta cada pregunta realmente respondida (applyAnswer se llama una vez por
     cada una, en todos los modos); nunca usar qs.length aquí: si el jugador pierde a mitad de
     una ronda, el total mostrado debe reflejar cuántas preguntas le hicieron de verdad. */
  const total = SES.totalCount;
  const correct = SES.correctCount, acc = total ? correct / total : 0;
  const gameType = SES.game, vidsUsed = SES.vids.slice();
  let result;
  if (SES.arcade) {
    const xp = correct * 8 + (failed ? 0 : 15);
    P.arcade[SES.game] = Math.max(P.arcade[SES.game] || 0, correct);
    P.xp += xp; saveState();
    result = { levelId: null, stars: 0, correct, total, failed, xp, missed: Array.from(SES.missed), nextId: null, game: gameType, vids: vidsUsed };
  } else {
    const stars = starsFor(acc, failed);
    const xp = correct * 10 + [0, 20, 45, 90][stars];
    const rec = recordLevelResult(SES.levelId, correct, total, failed, xp);
    const lvIdx = LEVELS.findIndex(l => l.id === SES.levelId);
    let nextId = null;
    if (!failed && rec.stars > 0 && lvIdx > -1 && lvIdx < LEVELS.length - 1) nextId = LEVELS[lvIdx + 1].id;
    if (LV[SES.levelId].boss && !failed && !SES.hintUsed) P.bossNoHint = true;
    result = { levelId: SES.levelId, stars: rec.stars, correct, total, failed, xp, missed: Array.from(SES.missed), nextId, game: gameType, vids: vidsUsed };
  }
  const newAch = checkAchievements();
  if (!failed && result.stars >= 2) confettiBurst(result.stars === 3 ? 90 : 55);
  sfx(failed ? "lose" : result.stars ? "star" : "correct");
  SES = null;
  S.params = Object.assign(result, { newAch });
  S.view = "result";
  render(true);
  newAch.forEach((a, i) => setTimeout(() => { sfx("unlock"); toast('<div class="ach-ic">' + ic(a.icon) + '</div><div><b>¡Logro!</b><div class="ach-s">' + esc(a.name) + "</div></div>"); }, 700 + i * 1000));
}

/* ============ EVENTOS ============ */
const ACT = {
  tab: el => setTab(el.dataset.tab),
  back: () => back(),
  quit: () => back(),
  sheet: el => openSheet(el.dataset.id),
  "sheet-close": () => closeSheet(),
  locked: () => { live.textContent = "Completa el nivel anterior para desbloquear este."; },
  "play-level": el => startLevel(Number(el.dataset.id)),
  arcade: el => startArcade(el.dataset.game),
  "map-home": () => { S.view = null; S.params = {}; S.stack = []; S.tab = "mapa"; render(true); },
  "result-retry": () => { const R = S.params; if (R.levelId) startLevel(R.levelId); else startArcade(R.game, R.vids); },
  verb: el => openView("verb", { vid: el.dataset.vid }),
  "practice-verb": el => startArcade("spell", [el.dataset.vid]),
  say: el => say(el.dataset.text),
  play: el => { const k = el.dataset.kind; if (PL.on && PL.kind === k) { stopList(); return; } if (k === "story") playList(k, STORY.map(l => plain(l.en))); else playList(k, VERBS.map(v => v.base + ". " + v.past + ".")); },
  seg: el => { stopList(true); S.dexSeg = el.dataset.seg; render(); },
  cover: () => { S.cover = !S.cover; S.revealed.clear(); render(); },
  reveal: el => { S.revealed.add(el.dataset.vid); say(V[el.dataset.vid].past); render(); },
  "story-cover": () => { stopList(true); S.storyCover = !S.storyCover; S.storyRevealed.clear(); render(); },
  "story-es": () => { stopList(true); S.storyEs = !S.storyEs; render(); },
  "story-reveal": el => { const i = Number(el.dataset.i); S.storyRevealed.add(i); say(V[STORY[i].vid].past); render(); },
  "toggle-es": () => { S.showEs = !S.showEs; render(); },
  sound: () => { P.sound = !P.sound; saveState(); if (!P.sound) { try { speechSynthesis.cancel(); } catch (e) {} stopList(true); } render(); },
  "meteor-ans": el => meteorAnswer(el.dataset.val),
  "balloon-ans": el => balloonAnswer(el.dataset.val),
  "tf-ans": el => tfAnswer(el.dataset.val),
  "spell-tile": el => spellTile(Number(el.dataset.i)),
  "spell-hint": () => spellHint(),
  "mem-flip": el => memFlip(el.dataset.key),
  "boss-check": () => bossCheck(),
  "boss-hint": () => bossHint(),
  next: () => { if (!SES) return; if (SES.game === "boss") { if (SES.bossHP <= 0) endLevel(false); else if (SES.hearts <= 0) endLevel(true); else bossNext(); } else advance(); },
  reset: () => {
    if (S.resetArm && Date.now() - S.resetArm < 6000) { P = freshState(); saveState(); S.resetArm = 0; render(); live.textContent = "Progreso borrado."; }
    else { S.resetArm = Date.now(); render(); setTimeout(() => { if (S.resetArm && Date.now() - S.resetArm >= 6000) { S.resetArm = 0; if (!S.view) render(); } }, 6100); }
  }
};
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("scrim")) { closeSheet(); return; }
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  actx();
  const fn = ACT[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => { if (e.target && e.target.id === "boss-input" && SES) SES.typed = e.target.value; });
document.addEventListener("keydown", e => {
  if (S.view !== "play" || !SES) return;
  const tag = e.target.tagName;
  if (e.key === "Enter") {
    if (e.repeat) return;
    if (SES.game === "boss") { e.preventDefault(); if (!SES.resolved) bossCheck(); else ACT.next(); }
    return;
  }
  if (tag === "INPUT") return;
  if (/^[1-4]$/.test(e.key) && !SES.resolved) {
    if (SES.game === "meteors") { const b = $$(".ans")[Number(e.key) - 1]; if (b) b.click(); }
    else if (SES.game === "balloons") { const b = $$(".balloon")[Number(e.key) - 1]; if (b) b.click(); }
  }
  if (SES.game === "truefalse" && !SES.resolved) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "f") { const b = $('[data-action="tf-ans"][data-val="false"]'); if (b) b.click(); }
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "v") { const b = $('[data-action="tf-ans"][data-val="true"]'); if (b) b.click(); }
  }
});

/* ============ ARRANQUE ============ */
const app = $("#app"), live = $("#live");
try { document.documentElement.lang = "es"; } catch (e) {}
render(false);
</script>
